<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IBM BOB Dev Day Certificate</title>

<style>
body{
    font-family:Arial,sans-serif;
    text-align:center;
    padding:20px;
}

input{
    width:400px;
    padding:12px;
    font-size:18px;
}

button{
    padding:12px 20px;
    margin-top:10px;
    font-size:18px;
    cursor:pointer;
}

canvas{
    max-width:100%;
    border:1px solid #ddd;
    margin-top:20px;
}

</head>
<body>

<h2>IBM BOB Dev Day Certificate</h2>

<input
    id="nameInput"
    placeholder="Enter your full name"
/>

<br>

<button onclick="generateCertificate()">
Generate Certificate
</button>

<br>

<canvas id="certificateCanvas"></canvas>

<br>

<button id="downloadBtn" style="display:none;">
Download Certificate
</button>

<script src="certificate.js"></script>

</body>
</html>
